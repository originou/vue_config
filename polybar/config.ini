; Polybar, Debian 12: one bar, Catppuccin "pills" (each module's left cap is drawn over the
; previous module's colour: keep the chain when adding or removing a module).
; Bar started by launch.sh (same folder) on every screen.

[colors]
background = #1e1e2e
background-alt = #313244
background-subtle = #181825
foreground = #cdd6f4
foreground-dim = #a6adc8
subtext = #6c7086
crust = #11111b

; Catppuccin Accents
blue = #89b4fa
lavender = #b4befe
sapphire = #74c7ec
sky = #89dceb
teal = #94e2d5
green = #a6e3a1
yellow = #f9e2af
peach = #fab387
maroon = #eba0ac
red = #f38ba8
mauve = #cba6f7
pink = #f5c2e7

; Brand colors
spotify = #1DB954

; Semantic aliases
active = ${colors.green}
urgent = ${colors.red}
warning = ${colors.peach}

; ------------------------------------------------------------------------------
; Pills: polybar has no per-module radius, so each block is wrapped in Nerd Font
; half-circles drawn in the block color over the bar background. The color goes on
; the labels (not format-background) so the caps keep the bar background.
; ------------------------------------------------------------------------------

[pill]
left = 
right = 
; font-4 (1-based index): tall enough for the caps to fill the bar height
font = 5

; ------------------------------------------------------------------------------
; Bar: one definition, started once per screen by launch_polybar.sh (MONITOR)
; ------------------------------------------------------------------------------

[bar/main]
width = 100%
; Height and font scale per screen, set by launch_polybar.sh from the resolution
; (dpi scales the font sizes, 96 = 1:1; the height in px is not scaled by it)
height = ${env:BAR_HEIGHT:28}
dpi = ${env:BAR_DPI:96}
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
top = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0

padding-left = 0
padding-right = 0
module-margin = 0

font-0 = "JetBrainsMono Nerd Font:style=Medium:size=9.5;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=9.5;2"
font-2 = "JetBrainsMono Nerd Font:size=11;2"
font-3 = "JetBrainsMono Nerd Font:size=13;3"
font-4 = "JetBrainsMono Nerd Font:size=16;4"
; Icons in the right modules (%{T6}…%{T-}), larger than the text. Propo keeps each
; icon's real width, the monospace variant clips them at this size.
font-5 = "JetBrainsMono Nerd Font Propo:size=11;2"

monitor = ${env:MONITOR:}

modules-left = i3
modules-center = xwindow scratchpad
modules-right = cpu memory filesystem pulseaudio wired date powermenu

; No cursor change over clickable / scrollable modules (cursor-click, cursor-scroll): the
; hand and the resize arrows were distracting, the normal arrow stays

enable-ipc = true


[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

; Workspaces = grey ribbon flush on the left edge, closed by a right cap. Focused and
; urgent workspaces end with their own right cap overlapping the grey next to them.
; Polybar doesn't expand ${...} inside a string, so those caps hardcode the hex colors:
; #a6e3a1 = green, #f38ba8 = red, #313244 = background-alt
format = <label-state><label-mode>
format-suffix = ${pill.right}
format-suffix-font = ${pill.font}
format-suffix-foreground = ${colors.background-alt}

label-mode-padding = 2
label-mode-foreground = ${colors.crust}
label-mode-background = ${colors.yellow}

; Focused workspace = capsule verte Catppuccin
label-focused = %name% %icon% %{T5}%{B#313244}%{F#a6e3a1}%{T-}
label-focused-foreground = ${colors.crust}
label-focused-background = ${colors.green}
label-focused-padding-left = 2
label-focused-padding-right = 0
label-focused-margin = 0

; Unfocused workspace = capsule sobre
label-unfocused = %name% %icon%
label-unfocused-foreground = ${colors.foreground-dim}
label-unfocused-background = ${colors.background-alt}
label-unfocused-padding = 2
label-unfocused-margin = 0

; Visible workspace (sur un autre écran connecté)
label-visible = %name% %icon%
label-visible-foreground = ${colors.blue}
label-visible-background = ${colors.background-alt}
label-visible-padding = 2
label-visible-margin = 0

; Urgent workspace
label-urgent = %name% %icon% %{T5}%{B#313244}%{F#f38ba8}%{T-}
label-urgent-foreground = ${colors.crust}
label-urgent-background = ${colors.red}
label-urgent-padding-left = 2
label-urgent-padding-right = 0
label-urgent-margin = 0

ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-8 = 9;
ws-icon-9 = 0;
ws-icon-10 = scratchpad;

[module/xwindow]
type = internal/xwindow
format = <label>
format-prefix = ${pill.left}
format-prefix-font = ${pill.font}
format-prefix-foreground = ${colors.background-alt}
format-suffix = ${pill.right}
format-suffix-font = ${pill.font}
format-suffix-foreground = ${colors.background-alt}
label = " %title:0:60:...% "
label-foreground = ${colors.foreground}
label-background = ${colors.background-alt}
label-empty =

[module/scratchpad]
type = custom/script
exec = ~/.config/polybar/scratchpad.sh
tail = true
; Left click: list the minimized popups (rofi), pick one to bring it back
click-left = ~/.config/polybar/scratchpad-menu.sh &
; Right click: action menu (restore all, move to workspace, move to new workspace)
click-right = ~/.config/polybar/scratchpad-actions.sh &
; Standalone pill with margins, hidden when output is empty
format = <label>
format-margin = 1
format-prefix = ${pill.left}
format-prefix-font = ${pill.font}
format-prefix-foreground = ${colors.sapphire}
format-suffix = ${pill.right}
format-suffix-font = ${pill.font}
format-suffix-foreground = ${colors.sapphire}
label = " %output% "
label-foreground = ${colors.crust}
label-background = ${colors.sapphire}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = ${pill.left}
format-prefix-font = ${pill.font}
format-prefix-foreground = ${colors.peach}
; Click: btop popup
label = "%{A1:~/.config/i3/term-popup.sh btop:} %{T6}%{T-} %percentage%% %{A}"
label-foreground = ${colors.crust}
label-background = ${colors.peach}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = ${pill.left}
format-prefix-font = ${pill.font}
format-prefix-foreground = ${colors.maroon}
format-prefix-background = ${colors.peach}
; Click: btop popup
label = "%{A1:~/.config/i3/term-popup.sh btop:} %{T6}%{T-} %percentage_used%% %{A}"
label-foreground = ${colors.crust}
label-background = ${colors.maroon}

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
fixed-values = true
format-mounted = <label-mounted>
format-mounted-prefix = ${pill.left}
format-mounted-prefix-font = ${pill.font}
format-mounted-prefix-foreground = ${colors.pink}
format-mounted-prefix-background = ${colors.maroon}
; Click: yazi in a floating alacritty + tmux session (term-popup.sh)
label-mounted = "%{A1:~/.config/i3/term-popup.sh ncdu /:} %{T6}󰋊%{T-} %percentage_used%% %{A}"
label-mounted-foreground = ${colors.crust}
label-mounted-background = ${colors.pink}

format-unmounted = <label-unmounted>
format-unmounted-prefix = ${pill.left}
format-unmounted-prefix-font = ${pill.font}
format-unmounted-prefix-foreground = ${colors.pink}
format-unmounted-prefix-background = ${colors.maroon}
label-unmounted = " %{T6}󰋊%{T-} n/a "
label-unmounted-foreground = ${colors.crust}
label-unmounted-background = ${colors.pink}

[module/pulseaudio]
type = internal/pulseaudio
; Works with PulseAudio and PipeWire (pipewire-pulse). Scroll: volume, click: mute
interval = 5
format-volume = <label-volume>
format-volume-prefix = ${pill.left}
format-volume-prefix-font = ${pill.font}
format-volume-prefix-foreground = ${colors.mauve}
format-volume-prefix-background = ${colors.pink}
label-volume = " %{T6}󰕾%{T-} %percentage%% "
label-volume-foreground = ${colors.crust}
label-volume-background = ${colors.mauve}
format-muted = <label-muted>
format-muted-prefix = ${pill.left}
format-muted-prefix-font = ${pill.font}
format-muted-prefix-foreground = ${colors.mauve}
format-muted-prefix-background = ${colors.pink}
label-muted = " %{T6}󰝟%{T-} muted "
label-muted-foreground = ${colors.crust}
label-muted-background = ${colors.mauve}
click-right = ~/.config/i3/term-popup.sh pulsemixer &

[module/wired]
type = internal/network
interface = ${env:ETH_IFACE}
interface-type = wired
interval = 3.0
format-connected = <label-connected>
format-connected-prefix = ${pill.left}
format-connected-prefix-font = ${pill.font}
format-connected-prefix-foreground = ${colors.blue}
format-connected-prefix-background = ${colors.mauve}
label-connected = " %{T6}󰈀%{T-} %downspeed:8% "
label-connected-foreground = ${colors.crust}
label-connected-background = ${colors.blue}

format-disconnected = <label-disconnected>
format-disconnected-prefix = ${pill.left}
format-disconnected-prefix-font = ${pill.font}
format-disconnected-prefix-foreground = ${colors.blue}
format-disconnected-prefix-background = ${colors.mauve}
label-disconnected = " %{T6}󰈀%{T-} off "
label-disconnected-foreground = ${colors.crust}
label-disconnected-background = ${colors.blue}

[module/date]
type = internal/date
interval = 1.0
date = %a %d %b
time = %H:%M
date-alt = %Y-%m-%d
time-alt = %H:%M:%S
format = <label>
format-prefix = ${pill.left}
format-prefix-font = ${pill.font}
format-prefix-foreground = ${colors.yellow}
format-prefix-background = ${colors.blue}
; Left click: alternate format (built-in)
label = " %{T6}󱑂%{T-} %date%  %time% "
label-foreground = ${colors.crust}
label-background = ${colors.yellow}

[module/powermenu]
type = custom/menu
format = <label-toggle><menu>
format-prefix = ${pill.left}
format-prefix-font = ${pill.font}
format-prefix-foreground = ${colors.red}
format-prefix-background = ${colors.yellow}

label-open = " %{T6}󰐥%{T-} "
label-open-foreground = ${colors.crust}
label-open-background = ${colors.red}
label-close = " %{T6}󰜺%{T-} "
label-close-foreground = ${colors.crust}
label-close-background = ${colors.red}
label-separator = " | "
label-separator-foreground = ${colors.crust}
label-separator-background = ${colors.red}

menu-0-0 = " %{T6}󰍃%{T-} logout "
menu-0-0-foreground = ${colors.crust}
menu-0-0-background = ${colors.red}
menu-0-0-exec = i3-msg exit

menu-0-1 = " %{T6}󰜉%{T-} reboot "
menu-0-1-foreground = ${colors.crust}
menu-0-1-background = ${colors.red}
menu-0-1-exec = systemctl reboot

menu-0-2 = " %{T6}󰐥%{T-} power off "
menu-0-2-foreground = ${colors.crust}
menu-0-2-background = ${colors.red}
menu-0-2-exec = systemctl poweroff

[settings]
screenchange-reload = true

[global/wm]
margin-top = 5
margin-bottom = 5
