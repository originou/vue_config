# tmux, linked to ~/.tmux.conf by install.sh.

set -g default-terminal "screen-256color"

# Transparent background (let alacritty opacity show through)
set-option -g status-style bg=default
set -g window-style        'bg=default'
set -g window-active-style 'bg=default'

# Prefix Alt+w
set -g prefix M-w
unbind C-b

set -sg escape-time 1
set -g focus-events on
set -g renumber-windows on

# Splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Mouse
set -g mouse on
unbind -Troot MouseDown3Pane
unbind -Troot MouseDown3Status
unbind -Troot MouseDown3StatusLeft

setw -g mode-keys vi

# Clipboard through OSC 52 (also from a tmux over ssh inside this one)
set -s set-clipboard on
set -as terminal-features ',screen-256color:clipboard'

# Selecting panes
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

bind J swap-pane -D
bind K swap-pane -U

bind -n C-S-Left swap-window -t -1
bind -n C-S-Right swap-window -t +1

bind -n C-Left  previous-window
bind -n C-Right next-window
bind -n M-j previous-window
bind -n M-k next-window

bind-key a send-prefix
bind-key C-a last-window

# fzf session picker (switch, create, move/extract a pane): scripts/tmux-session-picker.sh
bind-key s display-popup -E -w 80% -h 60% "bash ~/.local/bin/tmux-session-picker.sh"

# Modes
setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour1 bg=colour16 bold'

# Panes
set -g pane-border-lines heavy
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'bg=colour0 fg=#5294e2'

# Status bar
set -g status-position top
set -g status-justify left
set -g status-style 'bg=colour16 fg=colour4'
set -g status-right-length 200
set -g status-left-length 0

setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'
setw -g aggressive-resize on
set -g status-keys emacs
set -g message-style 'fg=colour16 bg=colour4 bold'
set display-panes-colour "white"
set display-panes-active-colour "blue"

# Plugins (TPM, cloned by install.sh; prefix + I installs them)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-fpp'
set -g @plugin 'jaclu/tmux-menus'
set -g @menus_trigger 'F9'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @sidebar-key 'w'
set -g @plugin 'MunifTanjim/tmux-suspend'
set -g @suspend_key 'F12'
set -g @suspend_suspended_options " \
  status-style::bg=red\\,fg=white, \
  @mode_indicator_custom_prompt:: SUSPENDED , \
  @mode_indicator_custom_mode_style::bg=red\\,fg=white\\,bold, \
"
set -g @plugin "arcticicestudio/nord-tmux"

setenv EDITOR "nvim"
set-option -sa terminal-overrides ',screen-256color:RGB'

# Navigation shared with nvim (C-hjkl; blocked when zoomed, except in nvim)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell -F '#{window_zoomed_flag}' '' 'if-shell "$is_vim" "send-keys C-h" "select-pane -L"'
bind-key -n C-j if-shell -F '#{window_zoomed_flag}' '' 'if-shell "$is_vim" "send-keys C-j" "select-pane -D"'
bind-key -n C-k if-shell -F '#{window_zoomed_flag}' '' 'if-shell "$is_vim" "send-keys C-k" "select-pane -U"'
bind-key -n C-l if-shell -F '#{window_zoomed_flag}' '' 'if-shell "$is_vim" "send-keys C-l" "select-pane -R"'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

# Nord theme, custom status contents
set -g @nord_tmux_show_status_content "0"
set -g status-left "#[fg=black,bg=blue,bold] #S #[fg=blue,bg=black,nobold,noitalics,nounderscore]"
set -g status-right "#{prefix_highlight}#[fg=brightblack,bg=black,nobold,noitalics,nounderscore]#[fg=white,bg=brightblack] ${NORD_TMUX_STATUS_DATE_FORMAT} #[fg=white,bg=brightblack,nobold,noitalics,nounderscore]#[fg=white,bg=brightblack] ${NORD_TMUX_STATUS_TIME_FORMAT} #[fg=cyan,bg=brightblack,nobold,noitalics,nounderscore]#[fg=black,bg=cyan,bold] #H|#{tmux_mode_indicator}"
set -g window-status-format "#[fg=black,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#I #[fg=white,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#W #F #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#I #[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#W #F #[fg=cyan,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-separator ""

# TPM (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
